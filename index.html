<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16181D" />
<title>바코드 재고 관리</title>
<style>
  :root{
    --bg:#F4F5F7; --panel:#FFFFFF; --ink:#16181D; --muted:#6B7280;
    --line:#E5E7EB; --chrome:#16181D; --accent:#2F6BFF;
    --in:#12B76A; --out:#F04438; --amber:#F79009;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); padding-bottom:calc(72px + var(--safe-b)); -webkit-font-smoothing:antialiased;}
  header{position:sticky; top:0; z-index:20; background:var(--chrome); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;}
  header .logo{font-weight:800; letter-spacing:-.3px; font-size:17px}
  header .logo b{color:var(--accent)}
  header .sub{margin-left:auto; font-size:11px; color:#9AA0A6; font-family:var(--mono); display:flex; align-items:center; gap:6px}
  header .dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}
  header .dot.ok{background:var(--in)} header .dot.err{background:var(--out)}
  main{max-width:640px; margin:0 auto; padding:14px}
  section{display:none}
  section.active{display:block; animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px}
  .card h2{margin:0 0 4px; font-size:15px; letter-spacing:-.2px}
  .card p.hint{margin:0 0 12px; color:var(--muted); font-size:12.5px; line-height:1.5}

  label.fld{display:block; margin-bottom:10px}
  label.fld span{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  input,select,textarea{width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  .mono{font-family:var(--mono)}

  button{font:inherit; cursor:pointer; border:none; border-radius:10px}
  .btn{padding:12px 14px; font-weight:700; font-size:14.5px; background:#EDF0F4; color:var(--ink)}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink)}
  .btn.block{width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.sm{padding:8px 11px; font-size:12.5px; border-radius:9px}
  .btn[disabled]{opacity:.5}

  #reader{width:100%; border-radius:12px; overflow:hidden; background:#000; min-height:0}
  #reader:empty{min-height:220px; display:grid; place-items:center}
  #reader:empty::after{content:"카메라 꺼짐"; color:#7a8; font-family:var(--mono); font-size:12px}
  .scanbar{display:flex; gap:8px; margin-top:12px}
  .mode-toggle{display:flex; background:#EDF0F4; border-radius:11px; padding:4px; gap:4px; margin-bottom:12px}
  .mode-toggle button{flex:1; padding:11px; font-weight:800; font-size:14px; background:transparent; color:var(--muted); border-radius:8px}
  .mode-toggle button.on[data-m="in"]{background:var(--in); color:#fff}
  .mode-toggle button.on[data-m="out"]{background:var(--out); color:#fff}

  .result{margin-top:12px; border:1px solid var(--line); border-radius:14px; padding:16px; display:none}
  .result.show{display:block; animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
  .result .nm{font-size:18px; font-weight:800; letter-spacing:-.3px}
  .result .code{font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-top:2px}
  .qtybox{display:flex; align-items:center; justify-content:center; gap:16px; margin:16px 0 4px}
  .qtybox .num{font-family:var(--mono); font-size:44px; font-weight:700; min-width:96px; text-align:center; line-height:1}
  .stepper{width:56px; height:56px; border-radius:50%; font-size:26px; font-weight:700; background:#EDF0F4}
  .result.unknown{border-style:dashed}

  .toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
  .toolbar input[type=search]{flex:1 1 140px}
  .item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .meta{flex:1; min-width:0}
  .item .meta .t{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .item .meta .c{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .item .q{font-family:var(--mono); font-weight:700; font-size:20px; min-width:44px; text-align:right}
  .item .q.zero{color:var(--out)}
  .empty{text-align:center; color:var(--muted); padding:34px 10px; font-size:13.5px; line-height:1.6}

  .log{display:flex; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13px; align-items:center}
  .log .d{width:8px;height:8px;border-radius:50%;flex:none}
  .log .d.in,.log .d.init{background:var(--in)} .log .d.out{background:var(--out)} .log .d.edit{background:var(--amber)}
  .log .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .ld{font-family:var(--mono); color:var(--muted); font-size:11px}
  .log .lv{font-family:var(--mono); font-weight:700}

  #previewWrap{margin-top:12px; text-align:center; background:#fff; border:1px dashed var(--line); border-radius:12px; padding:12px; display:none}
  #previewWrap.show{display:block}
  #previewWrap svg{max-width:100%}

  nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);}
  nav.tabs button{flex:1; background:none; padding:9px 0 10px; color:var(--muted); font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px}
  nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9}
  nav.tabs button.on{color:var(--accent)}

  .banner{font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:12px; display:none; line-height:1.55}
  .banner.show{display:block}
  .banner.warn{background:#FEF3C7; color:#92400E}
  .banner.err{background:#FEE4E2; color:#B42318}
  .banner code{font-family:var(--mono); background:rgba(0,0,0,.06); padding:1px 4px; border-radius:4px}
  .toast{position:fixed; left:50%; bottom:calc(84px + var(--safe-b)); transform:translateX(-50%); background:#16181D; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<header>
  <div class="logo">바<b>코</b>드 재고</div>
  <div class="sub"><span class="dot" id="statusDot"></span><span id="countPill">연결 중…</span></div>
</header>

<main>
  <div class="banner warn" id="setupBanner">⚙️ 설정이 필요해요. <code>index.html</code> 위쪽 <code>SUPABASE_URL</code>·<code>SUPABASE_KEY</code> 두 줄을 본인 프로젝트 값으로 바꿔주세요.</div>
  <div class="banner err" id="connBanner">📡 서버에 연결할 수 없어요. 인터넷 연결과 설정값을 확인해주세요.</div>

  <!-- ===== 스캔 ===== -->
  <section id="tab-scan" class="active">
    <div class="card">
      <div class="mode-toggle" id="modeToggle">
        <button data-m="in" class="on">＋ 입고</button>
        <button data-m="out">− 출고</button>
      </div>
      <div id="reader"></div>
      <div class="scanbar">
        <button class="btn primary block" id="btnScan">카메라 켜기</button>
        <button class="btn ghost sm" id="btnManual">직접 입력</button>
      </div>

      <div class="result" id="scanResult">
        <div class="nm" id="rNm">품목명</div>
        <div class="code mono" id="rCode">코드</div>
        <div class="qtybox">
          <button class="stepper" id="rMinus">−</button>
          <div class="num" id="rQty">0</div>
          <button class="stepper" id="rPlus">＋</button>
        </div>
        <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px">
          변경 <b id="rDelta" class="mono">+1</b> · 현재 <span id="rCur" class="mono">0</span> · <span id="rLoc">-</span>
        </div>
        <button class="btn primary block" id="rApply">기록 저장</button>
      </div>

      <div class="result unknown" id="unknownResult">
        <div class="nm">등록되지 않은 코드</div>
        <div class="code mono" id="uCode"></div>
        <p class="hint" style="margin:10px 0 12px">이 바코드는 아직 품목에 없어요. 새 품목으로 등록할까요?</p>
        <button class="btn primary block" id="uRegister">이 코드로 품목 등록</button>
      </div>
    </div>
  </section>

  <!-- ===== 등록 ===== -->
  <section id="tab-add">
    <div class="card">
      <h2>새 품목 등록</h2>
      <p class="hint">코드를 비워두면 자동 부여됩니다. 저장하면 아래에 바코드가 생성돼요.</p>
      <label class="fld"><span>품목명 *</span><input id="fName" placeholder="예) A4 복사용지 500매" /></label>
      <div class="row">
        <label class="fld"><span>코드 (바코드값)</span><input id="fCode" class="mono" placeholder="자동" inputmode="numeric" /></label>
        <label class="fld"><span>초기 수량</span><input id="fQty" type="number" value="0" inputmode="numeric" /></label>
      </div>
      <div class="row">
        <label class="fld"><span>위치 (선택)</span><input id="fLoc" placeholder="예) 창고 B-2" /></label>
        <label class="fld"><span>비고 (선택)</span><input id="fNote" placeholder="선택" /></label>
      </div>
      <button class="btn primary block" id="btnSaveItem">품목 저장</button>
      <div id="previewWrap">
        <svg id="previewSvg"></svg>
        <div style="margin-top:10px" class="row">
          <button class="btn sm" id="btnPrintOne">이 바코드 인쇄</button>
          <button class="btn sm ghost" id="btnNewAfter">새로 등록</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 재고 ===== -->
  <section id="tab-list">
    <div class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="품목·코드 검색" />
        <button class="btn sm" id="btnPrintAll">전체 바코드 인쇄</button>
      </div>
      <div class="toolbar">
        <button class="btn sm ghost" id="btnExport">CSV 내보내기</button>
        <button class="btn sm ghost" id="btnImport">CSV 불러오기</button>
        <button class="btn sm ghost" id="btnReload">새로고침</button>
        <input type="file" id="fileImport" accept=".csv,text/csv" hidden />
      </div>
      <div id="itemList"></div>
    </div>
  </section>

  <!-- ===== 이력 ===== -->
  <section id="tab-log">
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;flex:1">입출고 이력</h2>
      </div>
      <div id="logList"></div>
    </div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="scan" class="on">
    <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18"/></svg>
    스캔
  </button>
  <button data-tab="add">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    등록
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    재고
  </button>
  <button data-tab="log">
    <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/></svg>
    이력
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ══════════════ 설정: 아래 2줄만 본인 Supabase 값으로 바꾸세요 ══════════════ */
const SUPABASE_URL = "https://obcpxovlskqdufkqwqwa.supabase.co/rest/v1/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iY3B4b3Zsc2txZHVma3F3cXdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjQ4NDEsImV4cCI6MjEwMzE0MDg0MX0.KPMfEUWSX3wl0ZAxlJGL8AdxjB38v_ErYfBEkAyDTFU";
/* ═══════════════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const configured = SUPABASE_URL.indexOf('YOUR-')<0 && SUPABASE_KEY.indexOf('YOUR-')<0;
let sb=null, items=[], logs=[], mode='in';
const byCode = c => items.find(i => String(i.code) === String(c));
const deviceId = (()=>{ try{ let d=localStorage.getItem('binv_dev'); if(!d){d=Math.random().toString(36).slice(2,8); localStorage.setItem('binv_dev',d);} return d; }catch(e){ return 'web'; } })();

/* ---------- 유틸 ---------- */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }
function beep(good=true){
  try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination); o.frequency.value=good?880:280; g.gain.value=0.05; o.start(); setTimeout(()=>{o.stop();ac.close()},120);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(good?40:[30,40,30]);
}
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function nextCode(){ return Date.now().toString().slice(-9); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setStatus(state){ const d=$('#statusDot'); d.className='dot'+(state==='ok'?' ok':state==='err'?' err':''); }
function updateCount(){ $('#countPill').textContent=items.length+' 품목'; }
function safeBarcode(el, value){ try{ JsBarcode(el, String(value), {format:"CODE128", width:2, height:70, fontSize:15, margin:8}); return true; }catch(e){ return false; } }
function needSetup(){ if(!sb){ toast('먼저 설정을 완료하세요'); return true; } return false; }

/* ---------- 데이터 동기화 ---------- */
async function refresh(){
  if(!sb) return;
  try{
    const [s,m] = await Promise.all([
      sb.from('stock').select('*').order('name'),
      sb.from('movements').select('delta,type,at,items(name)').order('at',{ascending:false}).limit(300)
    ]);
    if(s.error) throw s.error; if(m.error) throw m.error;
    items = (s.data||[]).map(r=>({code:r.code,name:r.name,qty:r.qty||0,loc:r.loc||'',note:r.note||''}));
    logs  = (m.data||[]).map(r=>({name:(r.items&&r.items.name)||'(삭제된 품목)',delta:r.delta,type:r.type,at:r.at}));
    setStatus('ok'); $('#connBanner').classList.remove('show');
    updateCount(); renderList(); renderLog();
  }catch(e){ console.warn(e); setStatus('err'); $('#connBanner').classList.add('show'); }
}
let _rt=null; function scheduleRefresh(){ clearTimeout(_rt); _rt=setTimeout(refresh,400); }

/* ---------- 탭 전환 ---------- */
document.querySelectorAll('#tabs button').forEach(b=>{
  b.onclick=()=>{
    const t=b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active', s.id==='tab-'+t));
    if(t!=='scan') stopScan();
    if(t==='list') renderList();
    if(t==='log') renderLog();
  };
});
function switchTo(tab){ document.querySelector(`#tabs button[data-tab="${tab}"]`).click(); }

/* ---------- 스캔 ---------- */
let html5=null, scanning=false, lastScan={code:'',at:0};
document.querySelectorAll('#modeToggle button').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on',x===b)); };
});
async function startScan(){
  if(scanning) return; hideResults();
  if(typeof Html5Qrcode==='undefined'){ toast('스캐너 로딩 실패 · 인터넷 확인'); return; }
  html5=new Html5Qrcode('reader',{ formatsToSupport:[
    Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures:{useBarCodeDetectorIfSupported:true} });
  try{
    await html5.start({facingMode:'environment'},{fps:12,qrbox:{width:250,height:170}}, onScan, ()=>{});
    scanning=true; $('#btnScan').textContent='카메라 끄기'; $('#btnScan').classList.remove('primary');
  }catch(e){ toast('카메라를 열 수 없어요'); console.warn(e); }
}
async function stopScan(){ if(html5&&scanning){ try{ await html5.stop(); await html5.clear(); }catch(e){} } scanning=false; const b=$('#btnScan'); if(b){ b.textContent='카메라 켜기'; b.classList.add('primary'); } }
$('#btnScan').onclick=()=> scanning ? stopScan() : startScan();
function onScan(text){ const now=Date.now(); if(text===lastScan.code && now-lastScan.at<1800) return; lastScan={code:text,at:now}; handleCode(text); }
$('#btnManual').onclick=()=>{ const c=prompt('바코드값을 입력하세요'); if(c) handleCode(c.trim()); };

function handleCode(code){ const it=byCode(code); if(!it){ beep(false); showUnknown(code); return; } beep(true); showResult(it); }

let current=null, pending=0;
function showResult(it){
  current=it; pending = (mode==='in')?1:-1;
  $('#unknownResult').classList.remove('show');
  $('#rNm').textContent=it.name; $('#rCode').textContent=it.code; $('#rLoc').textContent=it.loc||'위치 미지정';
  renderPending();
  $('#scanResult').classList.add('show');
}
function renderPending(){
  const result=current.qty+pending;
  $('#rQty').textContent=result;
  $('#rQty').style.color = pending>0?'var(--in)':(pending<0?'var(--out)':'var(--ink)');
  $('#rDelta').textContent=(pending>0?'+':'')+pending;
  $('#rCur').textContent=current.qty;
}
function showUnknown(code){
  $('#scanResult').classList.remove('show');
  $('#uCode').textContent=code; $('#unknownResult').classList.add('show');
  $('#uRegister').onclick=()=>{ $('#fCode').value=code; switchTo('add'); $('#fName').focus(); };
}
function hideResults(){ $('#scanResult').classList.remove('show'); $('#unknownResult').classList.remove('show'); }
$('#rPlus').onclick=()=>{ pending++; renderPending(); };
$('#rMinus').onclick=()=>{ pending--; renderPending(); };
$('#rApply').onclick=async()=>{
  if(needSetup()) return;
  if(pending===0){ toast('변경 없음'); return; }
  const {error}=await sb.from('movements').insert({code:current.code,delta:pending,type:pending>0?'in':'out',device:deviceId});
  if(error){ toast('저장 실패'); console.warn(error); return; }
  toast(`${current.name} · ${pending>0?'+':''}${pending}`);
  hideResults(); await refresh();
};

/* ---------- 등록 ---------- */
$('#fCode').addEventListener('input', renderPreview);
function renderPreview(){ const c=$('#fCode').value.trim(); if(!c){ $('#previewWrap').classList.remove('show'); return; } if(safeBarcode($('#previewSvg'),c)) $('#previewWrap').classList.add('show'); }
$('#btnSaveItem').onclick=async()=>{
  if(needSetup()) return;
  const name=$('#fName').value.trim(); if(!name){ toast('품목명을 입력하세요'); $('#fName').focus(); return; }
  let code=$('#fCode').value.trim() || nextCode();
  const qty=parseInt($('#fQty').value||'0',10)||0;
  const {error}=await sb.from('items').insert({code,name,loc:$('#fLoc').value.trim(),note:$('#fNote').value.trim()});
  if(error){ toast(error.code==='23505'?'이미 있는 코드예요':'저장 실패'); console.warn(error); return; }
  if(qty!==0) await sb.from('movements').insert({code,delta:qty,type:'init',device:deviceId});
  $('#fCode').value=code; renderPreview(); toast('저장됨 · '+name); await refresh();
};
$('#btnNewAfter').onclick=()=>{ ['fName','fCode','fLoc','fNote'].forEach(id=>$('#'+id).value=''); $('#fQty').value='0'; $('#previewWrap').classList.remove('show'); $('#fName').focus(); };
$('#btnPrintOne').onclick=()=>{ const c=$('#fCode').value.trim(); const it=byCode(c)||{code:c,name:$('#fName').value.trim()||c}; printBarcodes([it]); };

/* ---------- 재고 목록 ---------- */
$('#search').addEventListener('input', renderList);
$('#btnReload').onclick=()=>{ refresh(); toast('새로고침'); };
function renderList(){
  const q=$('#search').value.trim().toLowerCase(); const box=$('#itemList');
  const list=items.filter(i=> !q || i.name.toLowerCase().includes(q) || String(i.code).includes(q));
  if(!list.length){ box.innerHTML=`<div class="empty">${items.length?'검색 결과가 없어요.':'아직 품목이 없어요.<br>등록 탭에서 첫 품목을 추가하세요.'}</div>`; return; }
  box.innerHTML='';
  list.forEach(it=>{
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<div class="meta"><div class="t">${esc(it.name)}</div><div class="c">${esc(it.code)}${it.loc?' · '+esc(it.loc):''}</div></div><div class="q ${it.qty<=0?'zero':''}">${it.qty}</div>`;
    el.onclick=()=>editItem(it.code); box.appendChild(el);
  });
}
async function editItem(code){
  if(needSetup()) return;
  const it=byCode(code); if(!it) return;
  const action=prompt(`"${it.name}" (재고 ${it.qty})\n\n새 수량을 입력하면 재고가 조정됩니다.\n삭제하려면 "삭제"라고 입력하세요.`, it.qty);
  if(action===null) return;
  if(action.trim()==='삭제'){
    if(confirm(`"${it.name}" 품목을 삭제할까요? (이력도 함께 삭제)`)){ const {error}=await sb.from('items').delete().eq('code',code); if(error){toast('삭제 실패');return;} toast('삭제됨'); await refresh(); }
    return;
  }
  const n=parseInt(action,10); if(isNaN(n)){ toast('숫자를 입력하세요'); return; }
  const delta=n-it.qty; if(delta!==0){ const {error}=await sb.from('movements').insert({code,delta,type:'edit',device:deviceId}); if(error){toast('수정 실패');return;} }
  toast('수정됨'); await refresh();
}

/* ---------- 이력 ---------- */
function renderLog(){
  const box=$('#logList');
  if(!logs.length){ box.innerHTML='<div class="empty">아직 입출고 기록이 없어요.</div>'; return; }
  box.innerHTML='';
  logs.forEach(l=>{ const el=document.createElement('div'); el.className='log';
    el.innerHTML=`<span class="d ${l.type}"></span><span class="lt">${esc(l.name)}</span><span class="ld">${fmtTime(l.at)}</span><span class="lv" style="color:${l.delta>0?'var(--in)':'var(--out)'}">${l.delta>0?'+':''}${l.delta}</span>`;
    box.appendChild(el);
  });
}

/* ---------- CSV ---------- */
$('#btnExport').onclick=()=>{
  const head=['코드','품목명','수량','위치','비고'];
  const rows=items.map(i=>[i.code,i.name,i.qty,i.loc||'',i.note||''].map(csvCell).join(','));
  const csv='\uFEFF'+head.join(',')+'\n'+rows.join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const a=document.createElement('a'); a.href=url; a.download='재고_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(url);
};
$('#btnImport').onclick=()=>{ if(!needSetup()) $('#fileImport').click(); };
$('#fileImport').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ importCSV(r.result); e.target.value=''; }; r.readAsText(f,'utf-8'); };
async function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2){ toast('데이터가 없어요'); return; }
  const head=rows[0].map(h=>h.replace(/^\uFEFF/,'').trim());
  const idx=n=>head.findIndex(h=>h===n);
  const ci=idx('코드'),ni=idx('품목명'),qi=idx('수량'),li=idx('위치'),bi=idx('비고');
  if(ni<0){ toast('"품목명" 열이 필요해요'); return; }
  const targets=[];
  for(let r=1;r<rows.length;r++){ const row=rows[r]; if(!row.length||!(row[ni]||'').trim()) continue;
    targets.push({ code:(ci>=0?row[ci]:'').trim()||nextCode(), name:row[ni].trim(),
      qty:parseInt((qi>=0?row[qi]:'0'),10)||0, loc:li>=0?(row[li]||'').trim():'', note:bi>=0?(row[bi]||'').trim():'' }); }
  if(!targets.length){ toast('가져올 행이 없어요'); return; }
  const up=await sb.from('items').upsert(targets.map(t=>({code:t.code,name:t.name,loc:t.loc,note:t.note})),{onConflict:'code'});
  if(up.error){ toast('불러오기 실패'); console.warn(up.error); return; }
  await refresh(); // 현재 수량 파악
  const moves=[]; targets.forEach(t=>{ const cur=byCode(t.code); const d=t.qty-(cur?cur.qty:0); if(d!==0) moves.push({code:t.code,delta:d,type:'edit',device:deviceId}); });
  if(moves.length){ const mv=await sb.from('movements').insert(moves); if(mv.error){ toast('수량 반영 실패'); console.warn(mv.error); } }
  await refresh(); toast(`불러오기 완료 · ${targets.length}건`);
}
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else{ if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if(c==='\r'){} else cell+=c; } }
  if(cell.length||row.length){ row.push(cell); rows.push(row); } return rows;
}
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

/* ---------- 인쇄 ---------- */
$('#btnPrintAll').onclick=()=>{ if(!items.length){ toast('품목이 없어요'); return; } printBarcodes(items); };
function printBarcodes(list){
  const w=window.open('','_blank');
  const data=JSON.stringify(list.map(i=>({code:String(i.code),name:i.name})));
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>바코드 인쇄</title>
  <style>body{font-family:sans-serif;margin:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .lab{border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;page-break-inside:avoid}
  .lab .n{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media print{.noprint{display:none}}</style></head><body>
  <div class="noprint" style="margin-bottom:10px"><button onclick="window.print()" style="padding:8px 16px;font-size:14px">인쇄하기</button></div>
  <div class="grid" id="g"></div>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
  <script>const D=${data};const g=document.getElementById('g');
  D.forEach(it=>{const d=document.createElement('div');d.className='lab';const s=document.createElement('div');s.className='n';s.textContent=it.name;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');d.appendChild(s);d.appendChild(svg);g.appendChild(d);
  try{JsBarcode(svg,it.code,{format:'CODE128',width:2,height:60,fontSize:14,margin:6});}catch(e){svg.outerHTML='<div style=\\'color:red;font-size:11px\\'>'+it.code+'</div>';}});
  <\/script></body></html>`);
  w.document.close();
}

/* ---------- 초기화 ---------- */
if(!configured){ $('#setupBanner').classList.add('show'); $('#countPill').textContent='설정 필요'; setStatus('err'); }
else{
  sb=supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  refresh();
  try{
    sb.channel('inv-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:'movements'},scheduleRefresh)
      .on('postgres_changes',{event:'*',schema:'public',table:'items'},scheduleRefresh)
      .subscribe();
  }catch(e){ console.warn('realtime off',e); }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
}
</script>
